name: CI

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  test:
    # Skip work-in-progress checkpoint commits (they're expected to fail)
    if: ${{ !startsWith(github.event.head_commit.message, 'wip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test 'tests/frontend/*.test.mjs'
