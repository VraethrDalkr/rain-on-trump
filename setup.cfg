[metadata]
name = rain-on-trump
version = 0.3.1

[options]
package_dir =
    = backend
packages = find:
install_requires =
    httpx>=0.27

[options.extras_require]
test =
    pytest>=7.0
    pytest-asyncio>=0.23
    pytest-httpx>=0.23

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = __pycache__,build,dist,.venv,backend/.venv
